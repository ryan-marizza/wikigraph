name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the in-flight run for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor from requires-python, plus the version used locally.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Editable install so `from wikigraph.parse import ...` resolves without
      # any PYTHONPATH juggling — the src/ layout is not importable otherwise.
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  lint:
    name: pylint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      # Config lives in [tool.pylint.*] in pyproject.toml.
      - name: Lint source
        run: python -m pylint src/wikigraph scripts

      # Tests get the same rules minus docstring nagging — a test name that
      # needs a docstring to explain it is a test that needs renaming.
      - name: Lint tests
        run: python -m pylint tests --disable=missing-module-docstring,missing-function-docstring